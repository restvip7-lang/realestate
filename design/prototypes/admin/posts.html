<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Новости и статьи — админка Kleo Homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/proto.css">
<link rel="stylesheet" href="../assets/admin.css">
<script src="auth.js" data-guard></script>
</head>
<body>
<div id="adm-content" style="display:grid;gap:18px">
  <section class="panel">
    <div class="panel-h">
      <div class="toolbar">
        <div class="segs" role="group" aria-label="Тип публикации" id="kind-f"><button type="button" aria-pressed="true" data-v="">Все</button><button type="button" aria-pressed="false" data-v="news">Новости</button><button type="button" aria-pressed="false" data-v="article">Статьи</button></div>
        <select id="cat-f" aria-label="Рубрика"><option value="">Все рубрики</option></select>
        <select id="st-f" aria-label="Статус"><option value="">Любой статус</option><option value="published">Опубликовано</option><option value="scheduled">Запланировано</option><option value="draft">Черновик</option></select>
        <input class="search-in" id="q" type="search" placeholder="Поиск по заголовку" aria-label="Поиск по заголовку">
      </div>
      <span class="hint" id="count"></span>
    </div>
    <table class="tbl">
      <thead><tr><th></th><th>Заголовок</th><th>Тип</th><th>Рубрика</th><th>Языки</th><th>Статус</th><th>Дата</th><th><span class="vh">Действия</span></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</div>

<script src="../assets/data.js"></script>
<script src="../assets/posts.js"></script>
<script src="admin.js"></script>
<script>
(() => {
  ADM.shell('posts', 'Новости и статьи', '<a href="post-edit.html?kind=news" class="btn btn-line btn-sm">+ Новость</a><a href="post-edit.html?kind=article" class="btn btn-coral btn-sm">+ Статья</a>');
  const $ = s => document.querySelector(s), { esc } = ADM;
  const CATS = ['Рынок и цены', 'Законы', 'ВНЖ и гражданство', 'Жизнь в Алании', 'Курсы валют', 'Новости агентства'];
  $('#cat-f').innerHTML += CATS.map(c => `<option>${c}</option>`).join('');
  const f = { kind: '', cat: '', st: '', q: '' };
  const fmtD = s => new Date(s).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', ...(s.length > 10 ? { hour: '2-digit', minute: '2-digit' } : {}) });

  function render() {
    const all = KH.posts(), q = f.q.toLowerCase();
    const list = all.filter(p => (!f.kind || p.kind === f.kind) && (!f.cat || p.cat === f.cat) && (!f.st || KH.postStatus(p) === f.st) && (!q || p.title.toLowerCase().includes(q)));
    $('#count').textContent = `Показано: ${list.length} из ${all.length}`;
    $('#rows').innerHTML = list.length ? list.map(p => {
      const st = KH.postStatus(p), img = p.cover || (p.img ? KH.IMG(p.img, 160) : '');
      return `<tr>
        <td class="c-thumb">${img ? `<img class="thumb" src="${img}" alt="" loading="lazy">` : '<div class="thumb ph-box" style="font-size:10px">нет фото</div>'}</td>
        <td class="ttl"><a href="post-edit.html?id=${p.id}">${p.pinned ? '<span class="pin-tag" style="color:var(--coral-deep);font-size:12px">Закреплено · </span>' : ''}${esc(p.title)}</a><div class="sub">${esc(p.author || '')}${p.source ? ' · источник: ' + esc(p.source) : ''}</div></td>
        <td><span class="deal ${p.kind === 'news' ? 'rent' : 'sale'}">${p.kind === 'news' ? 'Новость' : 'Статья'}</span></td>
        <td class="c-hide">${esc(p.cat)}</td>
        <td><div class="langs-st">${['ru', 'en', 'tr'].map(l => `<span class="${p.lang?.[l] ? 'on' : ''}" title="${p.lang?.[l] ? 'переведено' : 'нет перевода'}">${l.toUpperCase()}</span>`).join('')}</div></td>
        <td><span class="st ${st}">${ADM.POST_ST[st]}</span></td>
        <td class="sub">${fmtD(p.date)}</td>
        <td class="c-acts"><div class="acts"><a class="mini-btn" href="post-edit.html?id=${p.id}">Изменить</a>${st !== 'draft' ? `<button class="mini-btn" type="button" data-draft="${p.id}">В черновик</button>` : ''}</div></td></tr>`;
    }).join('') : '<tr class="empty-row"><td colspan="8">Публикаций нет. Создайте новость или статью.</td></tr>';
  }
  $('#kind-f').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; f.kind = b.dataset.v; $('#kind-f').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
  $('#cat-f').onchange = e => { f.cat = e.target.value; render(); };
  $('#st-f').onchange = e => { f.st = e.target.value; render(); };
  $('#q').oninput = e => { f.q = e.target.value.trim(); render(); };
  document.addEventListener('click', e => { const b = e.target.closest('[data-draft]'); if (!b) return; const p = KH.posts().find(x => x.id === +b.dataset.draft); try { KH.savePost(Object.assign({}, p, { status: 'draft' })); } catch (err) { ADM.toast('Не хватает места в браузере'); return; } ADM.toast('Снято с публикации'); render(); });
  const saved = new URLSearchParams(location.search).get('saved');
  if (saved) ADM.toast(`Публикация сохранена`);
  render();
})();
</script>
</body>
</html>
