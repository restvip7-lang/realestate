<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Объекты — админка Kleo Homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/proto.css">
<link rel="stylesheet" href="../assets/admin.css">
<script src="auth.js" data-guard></script>
</head>
<body>
<div id="adm-content" style="display:grid;gap:18px">
  <div class="stats" id="stats"></div>
  <section class="panel">
    <div class="panel-h">
      <div class="toolbar">
        <div class="segs" role="group" aria-label="Тип сделки" id="deal-f"><button type="button" aria-pressed="true" data-v="">Все</button><button type="button" aria-pressed="false" data-v="sale">Продажа</button><button type="button" aria-pressed="false" data-v="rent">Аренда</button></div>
        <select id="st-f" aria-label="Статус"><option value="">Любой статус</option></select>
        <select id="d-f" aria-label="Район"><option value="">Все районы</option></select>
        <input class="search-in" id="q" type="search" placeholder="Поиск по ID или названию" aria-label="Поиск по ID или названию">
      </div>
      <span class="hint" id="count"></span>
    </div>
    <table class="tbl">
      <thead><tr><th></th><th>Объект</th><th>Сделка</th><th>Район</th><th>Цена</th><th>Статус</th><th>Проверка цены</th><th><span class="vh">Действия</span></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</div>

<script src="../assets/data.js"></script>
<script src="admin.js"></script>
<script>
(() => {
  ADM.shell('objects', 'Объекты', '<a href="object-edit.html" class="btn btn-coral btn-sm">+ Добавить объект</a>');
  const $ = s => document.querySelector(s), { esc, eur, OBJ_ST } = ADM;
  const f = { deal: '', st: '', d: '', q: '' };
  $('#st-f').innerHTML += Object.entries(OBJ_ST).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  $('#d-f').innerHTML += KH.DISTRICTS.map(d => `<option value="${d.slug}">${d.name}</option>`).join('');

  function render() {
    const all = KH.objects();
    const pub = all.filter(o => o.status === 'published');
    $('#stats').innerHTML = [
      ['Опубликовано', pub.length], ['На продажу', pub.filter(o => o.deal === 'sale').length],
      ['В аренду', pub.filter(o => o.deal === 'rent').length], ['Черновики', all.filter(o => o.status === 'draft').length]
    ].map(([t, n]) => `<div class="stat"><span>${t}</span><b>${n}</b></div>`).join('');

    const q = f.q.toLowerCase();
    const list = all.filter(o => (!f.deal || o.deal === f.deal) && (!f.st || o.status === f.st) && (!f.d || o.district === f.d) && (!q || String(o.id).includes(q) || o.title.toLowerCase().includes(q)));
    $('#count').textContent = `Показано: ${list.length} из ${all.length}`;
    $('#rows').innerHTML = list.length ? list.map(o => {
      const d = KH.district(o.district);
      const img = o.cover || KH.IMG(o.img, 160);
      return `<tr>
        <td class="c-thumb"><img class="thumb" src="${img}" alt="" loading="lazy"></td>
        <td class="ttl"><a href="object-edit.html?id=${o.id}">${esc(o.title)}</a><div class="sub mono">ID ${o.id} · ${KH.TYPES[o.type]} ${esc(o.rooms)} · ${o.area} м²${o.local ? ' · изменён в админке' : ''}</div></td>
        <td><span class="deal ${o.deal}">${o.deal === 'rent' ? 'Аренда' : 'Продажа'}</span></td>
        <td class="c-hide">${d.name}</td>
        <td class="num">${eur(o.price)}${o.deal === 'rent' ? ' / мес' : ''}</td>
        <td><span class="st ${o.status}">${OBJ_ST[o.status]}</span></td>
        <td class="c-hide sub">${o.checked || '—'}</td>
        <td class="c-acts"><div class="acts">
          <a class="mini-btn" href="object-edit.html?id=${o.id}">Изменить</a>
          <a class="mini-btn" href="../property.html?id=${o.id}&preview=1" target="_blank">На сайте</a>
          <button class="mini-btn" type="button" data-dup="${o.id}">Дублировать</button>
          ${o.status === 'published' ? `<button class="mini-btn" type="button" data-hide="${o.id}">Снять</button>` : `<button class="mini-btn" type="button" data-pub="${o.id}">Опубликовать</button>`}
        </div></td></tr>`;
    }).join('') : '<tr class="empty-row"><td colspan="8">Ничего не найдено. Измените фильтры или добавьте объект.</td></tr>';
  }

  $('#deal-f').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; f.deal = b.dataset.v; $('#deal-f').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
  $('#st-f').onchange = e => { f.st = e.target.value; render(); };
  $('#d-f').onchange = e => { f.d = e.target.value; render(); };
  $('#q').oninput = e => { f.q = e.target.value.trim(); render(); };

  document.addEventListener('click', e => {
    const dup = e.target.closest('[data-dup]'), hide = e.target.closest('[data-hide]'), pub = e.target.closest('[data-pub]');
    const find = id => KH.objects().find(o => o.id === +id);
    if (dup) { const o = find(dup.dataset.dup); const c = Object.assign({}, o, { id: KH.nextId(o.deal), status: 'draft', title: o.title + ' (копия)' }); delete c.local; KH.saveObject(c); ADM.toast(`Создан черновик ID ${c.id}`); render(); }
    if (hide) { const o = find(hide.dataset.hide); KH.saveObject(Object.assign({}, o, { status: 'hidden' })); ADM.toast(`ID ${o.id} снят с публикации`); render(); }
    if (pub) { const o = find(pub.dataset.pub); KH.saveObject(Object.assign({}, o, { status: 'published' })); ADM.toast(`ID ${o.id} опубликован`); render(); }
  });

  const saved = new URLSearchParams(location.search).get('saved');
  if (saved) ADM.toast(`Объект ID ${saved} сохранён`);
  render();
})();
</script>
</body>
</html>
